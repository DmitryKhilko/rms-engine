# ==========================================================================
# zensical.toml — конфигурация сайта требований (Zensical, подход Documentation as Code)
#
# Заготовка движка rms-engine для нового продукта: замените название сайта и значения в угловых скобках.
#
# Порядок разделов:
#   1. [project]            — сведения о сайте и репозитории (у продукта свои)
#   2. Меню (nav)           — формируется скриптом движка, вручную не редактируется
#   3. Общие настройки      — тема, возможности, шрифты, цветовые схемы, расширения Markdown: блок BEGIN/END ENGINE
#                             SETTINGS переписывается при каждой сборке из zensical.base.toml движка rms-engine;
#                             вручную не редактируется (изменения пропадут) — меняйте их в движке, для всех продуктов
#   4. [project.extra]      — значения для шаблонов и скриптов (трекер; у продукта свои)
#
# Ключи раздела [project] пишутся только в разделе 1 (до блока общих настроек), каждая своя таблица продукта — со своим
# заголовком после блока. Документы аналитиков и изображения — в docs/; настройки продукта для скриптов — в rms.toml.
# Подробнее — в README.md.
# ==========================================================================

# --- 1. САЙТ И РЕПОЗИТОРИЙ ---
[project]
site_name = "Название продукта"
site_description = "Требования к программному продукту"
site_url = "https://<владелец>.github.io/<репозиторий>/"
site_author = "Автор"
# Ссылка на репозиторий в шапке и кнопка «Править страницу» (content.action.edit): адрес правки = repo_url + edit_uri + путь к файлу
repo_url = "https://github.com/<владелец>/<репозиторий>"
repo_name = "GitHub"
edit_uri = "edit/main/docs/"

# --- 2. МЕНЮ ---
# Блок между маркерами формирует скрипт движка (engine/py/nav.py) при сборке (CI); вручную его не правят: изменения
# пропадут. Неизменная часть меню и названия пунктов задаются в rms.toml ([nav], [titles], [global_sf]).
# Маркеры BEGIN/END не удалять и не переименовывать. Блок должен оставаться в разделе [project] (до [project.theme]).
# BEGIN GENERATED NAV — не редактируйте вручную
nav = []
# END GENERATED NAV

# BEGIN ENGINE SETTINGS — общие настройки движка rms-engine, вручную не редактируйте
# Блок заполняет движок при первой сборке (python engine/py/site_settings.py).
# END ENGINE SETTINGS

# --- 4. ЗНАЧЕНИЯ ДЛЯ ШАБЛОНОВ И СКРИПТОВ (продукт) ---
# Читаются паспортом спецификации и скриптом генерации; сами по себе на странице не выводятся.
[project.extra.tracker]
# Адрес задач в трекере: ссылка в «паспорте» спецификации строится как task_url + номер из поля task_id
# (например, "https://github.bmf/khilko/app_requirements/issues/" + "1"). Адрес должен оканчиваться на «/».
task_url = "https://<трекер>/issues/"
