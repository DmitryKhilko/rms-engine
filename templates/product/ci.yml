name: ci

# Сборка и публикация сайта требований. Все шаги (версии и журналы изменений, статусы, меню, дашборд, сборка Zensical,
# публикация на GitHub Pages) описаны в общем workflow движка rms-engine; здесь — только его вызов.
# Версия движка: v1 — последняя версия первой линейки (исправления приходят сами); для точной версии укажите тег,
# например v1.0.0, в обеих строках (uses и engine_ref).
on:
  push:
    branches:
      - main
  workflow_dispatch:   # ручной запуск из вкладки Actions (например, чтобы сразу подхватить новую версию движка)
  # Еженедельная сборка: продукт подхватывает обновления движка (общие настройки сайта, тему, скрипты), даже если
  # в его main ничего не отправляли. Чтобы включить — раскомментируйте (время UTC):
  # schedule:
  #   - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  ci:
    uses: DmitryKhilko/rms-engine/.github/workflows/build.yml@v1
    with:
      engine_ref: v1
    permissions:
      contents: write   # коммит сформированных файлов в main
      pages: write      # публикация GitHub Pages
      id-token: write   # авторизация публикации
    # Если репозиторий движка приватный, нужен токен с правом чтения его содержимого (секрет репозитория или организации):
    # secrets:
    #   engine_token: ${{ secrets.RMS_ENGINE_TOKEN }}
