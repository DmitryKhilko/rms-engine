# ==========================================================================
# rms.toml — настройки продукта для движка rms-engine (заготовка)
#
# Все разделы необязательны: без раздела действует значение движка по умолчанию. Подробнее — README движка,
# раздел «Настройки продукта».
# ==========================================================================

# Неизменная часть меню (как блок nav в zensical.toml). "@registry" — «Реестр требований»,
# "@global_sf" — «Глобальные функциональности»; пути — относительно docs/.
[nav]
items = [
    { "О продукте" = "index.md" },
    { "Требования" = [
        { "Глоссарий" = "requirements/business-context/glossary.md" },
        { "Глобальные требования" = [
            "requirements/global/index.md",
            "@global_sf",
        ] },
        "@registry",
    ] },
]

[registry]
title = "Реестр требований"
dir = "requirements/features"

[dashboard]
page = "requirements/features/index.md"

[global_sf]
title = "Глобальные функциональности"
dir = "requirements/global"
prefix = "sf-g-"

# Названия глобальных функциональностей в меню: папка = "название"
[global_sf.titles]
# sf-g-table = "Таблица"

# Дополнительные названия папок и файлов фич (стандартные задаёт движок)
# [titles.folders]
# sf-export = "Выгрузка"
# [titles.files]
# context.md = "Контекст"
